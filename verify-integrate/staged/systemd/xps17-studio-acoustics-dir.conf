# Staged systemd user drop-in for:
#   ~/.config/systemd/user/omarchy-speaker-engine.service.d/xps17-studio-acoustics-dir.conf
#
# Directs libxps17_studio_dsp.so Stage 4 internal 4096-tap FIR convolver to load
# the installed Lead 2 kernels (`kernels/xps17-studio-{deep,spatial,reference,voice}.wav`)
# and `dsp_params.json` from the user's XDG data directory (independent of repo checkout).
# Never touches easyeffects-speaker-dsp.service.d/no-mic-monitor.conf.
[Service]
Environment=XPS17_STUDIO_ACOUSTICS_DIR=%h/.local/share/xps17-studio-audio
