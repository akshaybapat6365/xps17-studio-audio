# Dell XPS 17 9720 Studio Audio Engineering Stack — PipeWire Filter-Chain Sinks
#
# Staged drop-in for:
#   ~/.config/pipewire/omarchy-speaker-engine.conf.d/92-xps17-studio.conf
#
# Hosted by omarchy-speaker-engine.service (`pipewire -c omarchy-speaker-engine.conf`).
# All four filter-chain sinks use distinct capture/playback node names and passive
# playback streams (`node.passive = true`), so they coexist cleanly alongside
# 90-warm-deep.conf (`omarchy_speaker_engine`) and 91-spatial-fdtr.conf
# (`omarchy_speaker_spatial`, `omarchy_speaker_spatial_71`) with zero routing
# collisions and zero CPU usage when idle.
#
# Installed Runtime Assets (PipeWire does NOT expand `~` or `$HOME` in .conf files;
# `deploy-studio-dsp.sh` / `install.sh` copies built assets from the workspace into
# `~/.local/share/xps17-studio-audio/` and substitutes the home prefix if needed):
#   - Native SIMD/ASM+Rust LADSPA plugin (label `xps17_studio_dsp`, UniqueID 597201):
#       Runtime : /home/akshaybapat/.local/share/xps17-studio-audio/lib/libxps17_studio_dsp.so
#       Source  : /home/akshaybapat/project/xps17-studio-audio/dsp-engine/lib/libxps17_studio_dsp.so
#   - 4096-tap @ 48 kHz minimum-phase stereo float32 FIR room/speaker kernels:
#       Runtime : /home/akshaybapat/.local/share/xps17-studio-audio/kernels/xps17-studio-{deep,spatial,reference,voice}.wav
#       Source  : /home/akshaybapat/project/xps17-studio-audio/acoustics-research/kernels/xps17-studio-*.wav
#       Loaded internally by Stage 4 of `libxps17_studio_dsp.so` via
#       `XPS17_STUDIO_ACOUSTICS_DIR` (staged systemd drop-in
#       `omarchy-speaker-engine.service.d/xps17-studio-acoustics-dir.conf`).
#
# Signal-Flow Ordering Rationale (ZERO Double-Convolution!):
#   `libxps17_studio_dsp.so` executes the complete 7-stage hard-RT mastering chain
#   internally in exact acoustic order:
#     1. Klippel nonlinear woofer excursion predictor & dynamic sliding HPF
#     2. 3-band missing-fundamental psychoacoustic bass & chest warmth
#     3. Live volume-coupled ISO 226:2023 equal-loudness contour
#     4. Internal AVX2/FMA 32-partition 4096-tap minimum-phase FIR convolver
#        (loads Lead 2's `xps17-studio-{deep,spatial,reference,voice}.wav` per Mode)
#     5. Phase-coherent 4-band LR4 mastering multiband dynamics
#     6. Post-dynamics nearfield stage depth & mono-anchored Choueiri FDTR-XTC
#     7. 4x oversampled Catmull-Rom AVX2 true-peak brickwall limiter (-1.0 dBFS)
#   Because Stage 4 ALREADY convolves Lead 2's 4096-tap FIR internally BEFORE the
#   multiband dynamics and final 4x true-peak limiter, NO external PipeWire
#   `convolver` node is added here — preventing double-EQ (+12 dB error), double
#   phase shift, and duplicate convolver CPU overhead.
#
# Live Volume Tracking (fixes the frozen-contour bug of 91-spatial-fdtr.conf):
#   `omarchy-speaker-dsp-controller` continuously tracks the physical speaker
#   volume (PipeWire cubic scale 0..100%) and updates `studio:Volume (dB)` live
#   in [-45.0, 0.0] dB via `pw-cli set-param <id> Props`, driving ISO 226:2023
#   equal-loudness compensation and Klippel excursion scaling while preserving
#   per-profile mastering loudness authority (`Drive (dB)`).
#   The file default `Volume (dB) = -12.0` is safe even before the controller connects.

context.modules = [
  # ---------------------------------------------------------------------------
  # 1. Studio Deep ("Laptop Speakers · Studio Deep") — Flagship Warm & Deep
  #    Mode = 0.0 | Internal Stage 4 FIR: xps17-studio-deep.wav
  #    Hybrid physical (82 Hz sliding floor) + missing-fundamental bass, rich
  #    low-mid chest warmth, anchored early-reflection stage depth, +7.0 dB
  #    LOUDNESS_DRIVE_DB into -1.0 dBFS 4x true-peak brickwall ceiling.
  # ---------------------------------------------------------------------------
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Laptop Speakers · Studio Deep"
      media.name       = "Laptop Speakers · Studio Deep"
      filter.graph = {
        nodes = [
          { type = builtin name = in_l label = copy }
          { type = builtin name = in_r label = copy }

          # Fused 7-stage AVX2/FMA+Rust Studio DSP Engine (incl. Stage 4 4096-tap FIR)
          { type = ladspa name = studio
            plugin = "/home/akshaybapat/.local/share/xps17-studio-audio/lib/libxps17_studio_dsp.so"
            label  = "xps17_studio_dsp"
            control = {
              "Mode"             = 0.0
              "Volume (dB)"      = -12.0
              "Bass Depth"       = 1.0
              "Physical Bass Hz" = 82.0
              "Warmth Body"      = 1.0
              "Stage Depth"      = 0.85
              "Spatial XTC"      = 0.0
              "Drive (dB)"       = 7.0
              "Ceiling (dBFS)"   = -1.0
              "Excursion Guard"  = 1.0
            } }
        ]
        links = [
          { output = "in_l:Out" input = "studio:In L" }
          { output = "in_r:Out" input = "studio:In R" }
        ]
        inputs  = [ "in_l:In" "in_r:In" ]
        outputs = [ "studio:Out L" "studio:Out R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "omarchy_speaker_studio"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name           = "omarchy_speaker_studio_output"
        node.passive        = true
        node.dont-move      = true
        state.restore-props = false
        target.object       = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink"
        node.dont-fallback  = true
        node.linger         = true
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 2. Studio Spatial ("Laptop Speakers · Studio Spatial") — Cinema / Wide 3D
  #    Mode = 1.0 | Internal Stage 4 FIR: xps17-studio-spatial.wav
  #    Post-dynamics mono-anchored FDTR-XTC (Spatial XTC = 0.75) so Side energy
  #    never pumps center vocals or bass in the limiter.
  # ---------------------------------------------------------------------------
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Laptop Speakers · Studio Spatial"
      media.name       = "Laptop Speakers · Studio Spatial"
      filter.graph = {
        nodes = [
          { type = builtin name = in_l label = copy }
          { type = builtin name = in_r label = copy }

          { type = ladspa name = studio
            plugin = "/home/akshaybapat/.local/share/xps17-studio-audio/lib/libxps17_studio_dsp.so"
            label  = "xps17_studio_dsp"
            control = {
              "Mode"             = 1.0
              "Volume (dB)"      = -12.0
              "Bass Depth"       = 1.0
              "Physical Bass Hz" = 82.0
              "Warmth Body"      = 1.0
              "Stage Depth"      = 0.85
              "Spatial XTC"      = 0.75
              "Drive (dB)"       = 7.0
              "Ceiling (dBFS)"   = -1.0
              "Excursion Guard"  = 1.0
            } }
        ]
        links = [
          { output = "in_l:Out" input = "studio:In L" }
          { output = "in_r:Out" input = "studio:In R" }
        ]
        inputs  = [ "in_l:In" "in_r:In" ]
        outputs = [ "studio:Out L" "studio:Out R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "omarchy_speaker_studio_spatial"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name           = "omarchy_speaker_studio_spatial_output"
        node.passive        = true
        node.dont-move      = true
        state.restore-props = false
        target.object       = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink"
        node.dont-fallback  = true
        node.linger         = true
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 3. Studio Reference ("Laptop Speakers · Studio Reference") — Harman/Olive Neutral
  #    Mode = 2.0 | Internal Stage 4 FIR: xps17-studio-reference.wav
  #    Neutral monitor balance, restrained warmth/stage coloration, tight
  #    excursion-protected bass, +6.0 dB mastering drive into -1.0 dBFS.
  # ---------------------------------------------------------------------------
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Laptop Speakers · Studio Reference"
      media.name       = "Laptop Speakers · Studio Reference"
      filter.graph = {
        nodes = [
          { type = builtin name = in_l label = copy }
          { type = builtin name = in_r label = copy }

          { type = ladspa name = studio
            plugin = "/home/akshaybapat/.local/share/xps17-studio-audio/lib/libxps17_studio_dsp.so"
            label  = "xps17_studio_dsp"
            control = {
              "Mode"             = 2.0
              "Volume (dB)"      = -12.0
              "Bass Depth"       = 0.75
              "Physical Bass Hz" = 82.0
              "Warmth Body"      = 0.65
              "Stage Depth"      = 0.35
              "Spatial XTC"      = 0.0
              "Drive (dB)"       = 6.0
              "Ceiling (dBFS)"   = -1.0
              "Excursion Guard"  = 1.0
            } }
        ]
        links = [
          { output = "in_l:Out" input = "studio:In L" }
          { output = "in_r:Out" input = "studio:In R" }
        ]
        inputs  = [ "in_l:In" "in_r:In" ]
        outputs = [ "studio:Out L" "studio:Out R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "omarchy_speaker_studio_ref"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name           = "omarchy_speaker_studio_ref_output"
        node.passive        = true
        node.dont-move      = true
        state.restore-props = false
        target.object       = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink"
        node.dont-fallback  = true
        node.linger         = true
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 4. Studio Voice ("Laptop Speakers · Studio Voice") — Ultra-Clear Vocal / Podcast
  #    Mode = 3.0 | Internal Stage 4 FIR: xps17-studio-voice.wav
  #    95 Hz sliding bass floor removes rumble/boomy proximity, intimate stage,
  #    natural vocal chest warmth, +7.5 dB speech loudness drive.
  # ---------------------------------------------------------------------------
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Laptop Speakers · Studio Voice"
      media.name       = "Laptop Speakers · Studio Voice"
      filter.graph = {
        nodes = [
          { type = builtin name = in_l label = copy }
          { type = builtin name = in_r label = copy }

          { type = ladspa name = studio
            plugin = "/home/akshaybapat/.local/share/xps17-studio-audio/lib/libxps17_studio_dsp.so"
            label  = "xps17_studio_dsp"
            control = {
              "Mode"             = 3.0
              "Volume (dB)"      = -12.0
              "Bass Depth"       = 0.55
              "Physical Bass Hz" = 95.0
              "Warmth Body"      = 0.70
              "Stage Depth"      = 0.25
              "Spatial XTC"      = 0.0
              "Drive (dB)"       = 7.5
              "Ceiling (dBFS)"   = -1.0
              "Excursion Guard"  = 1.0
            } }
        ]
        links = [
          { output = "in_l:Out" input = "studio:In L" }
          { output = "in_r:Out" input = "studio:In R" }
        ]
        inputs  = [ "in_l:In" "in_r:In" ]
        outputs = [ "studio:Out L" "studio:Out R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "omarchy_speaker_studio_voice"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name           = "omarchy_speaker_studio_voice_output"
        node.passive        = true
        node.dont-move      = true
        state.restore-props = false
        target.object       = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink"
        node.dont-fallback  = true
        node.linger         = true
      }
    }
  }
]
