# Minimal PipeWire filter-chain host for Studio Speaker Audio (any Omarchy / Linux PC).
# Runs as: pipewire -c omarchy-speaker-engine.conf
# Merges drop-ins from ~/.config/pipewire/omarchy-speaker-engine.conf.d/*.conf
# without restarting the main PipeWire or WirePlumber daemons.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { rtportal.enabled = false }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
]
