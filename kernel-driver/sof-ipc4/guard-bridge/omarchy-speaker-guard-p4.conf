# Systemd drop-in enabling P4 Kernel Deadman Guard Bridge in `omarchy-speaker-guard.service`.
#
# Target deployment path (staged only; DO NOT deploy until P4 driver & calibrated model verified!):
#   ~/.config/systemd/user/omarchy-speaker-guard.service.d/omarchy-speaker-guard-p4.conf
#
# Safety layers (defence-in-depth):
#   1. Userspace bridge (`p4_deadman_bridge.py`) verifies all 7 safety invariants
#      (trusted calibration, non-colliding 4-ch IV slots, fresh plausible IV-sense,
#       DRC off, T_coil < 70 C w/ 3 C hysteresis, excursion < 0.90 Xmax, stream active)
#      before emitting magic `0xdec1be15` at 50 ms cadence.
#   2. Python SIGTERM/SIGINT handler sends explicit `0` to both P4 controls immediately.
#   3. ExecStopPost below sends explicit `0` to both P4 controls even after SIGKILL/crash.
#   4. Kernel `snd-soc-rt1316-sdw` 250 ms deadman watchdog autonomously reverts
#      `0xC60F=0x01`, `0xD002=0xBF`, `0xD004=0xBF` within 250 ms if userspace stalls.
[Service]
Environment=SPK_GUARD_P4_ENABLE=1
Environment=SPK_GUARD_P4_CARD=sofsoundwire
Environment=SPK_GUARD_P4_HEARTBEAT_MS=50
Environment=SPK_GUARD_P4_MAGIC=0xdec1be15
Environment=SPK_GUARD_P4_CTL_LEFT=rt1316-1 Guard Drive Unlock
Environment=SPK_GUARD_P4_CTL_RIGHT=rt1316-2 Guard Drive Unlock
Environment=SPK_GUARD_P4_T_CEILING_C=70.0
Environment=SPK_GUARD_P4_T_HYSTERESIS_C=3.0
WatchdogSec=1s
ExecStopPost=-/usr/bin/amixer -c sofsoundwire -q cset "name=rt1316-1 Guard Drive Unlock" 0
ExecStopPost=-/usr/bin/amixer -c sofsoundwire -q cset "name=rt1316-2 Guard Drive Unlock" 0
