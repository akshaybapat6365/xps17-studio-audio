# Dell XPS 17 9720 (DMI SKU 0AFF) — ALSA UCM2 IPC4 DRC Fence & Optional EQIIR Safety Override.
#
# Target deployment path (staged only; DO NOT deploy until Coordinator verification):
#   /usr/share/alsa/ucm2/blobs/sof/user_configs/Dell Inc./XPS 17 9720.conf
#
# How UCM2 loads this file (verified in alsa-ucm-conf / alsaucm 1.2.16):
#   1. /usr/share/alsa/ucm2/sof-soundwire/sof-soundwire.conf:255 includes
#      /usr/share/alsa/ucm2/Intel/sof-hda-dsp/dsp.conf.
#   2. dsp.conf:133-149 resolves DMI sys_vendor ("Dell Inc.") and product_name ("XPS 17 9720")
#      and includes /blobs/sof/user_configs/Dell Inc./XPS 17 9720.conf BEFORE line 258.
#   3. sof-soundwire.conf:258 invokes Macro.SpeakerDrc.SofDrcBootSetup, which checks
#      `ControlExists "name='${var:PostMixerSpeakerPlaybackDrcSwitch}'"` and turns it ON
#      (activating the topology's default +13.7 dB makeup-gain DRC!).
#   4. By overriding PostMixerSpeakerPlaybackDrcSwitch to "N/A" (a nonexistent kcontrol),
#      SofDrcBootSetup becomes a guaranteed no-op on every IPC4 card initialization while
#      having zero effect under IPC3.
#
# 1. MANDATORY DRC FENCE (UNCONDITIONAL):
Define.PostMixerSpeakerPlaybackDrcSwitch "N/A"
Define.PostMixerSpeakerPlaybackDrcBlob ""

# 2. OPTIONAL HARDWARE-DSP 80 Hz 4th-ORDER BUTTERWORTH SUBSONIC SAFETY HPF:
#    If blobs/eqiir_subsonic_80hz_safety.bin is deployed to the UCM2 IPC4 blobs directory,
#    SofEqBootSetup (sof-soundwire.conf:259) loads it automatically via cset-tlv into
#    `Post Mixer Speaker Playback IIR Eq bytes` (replacing the topology default 100 Hz 2nd-order HPF).
#    If not deployed, this path check evaluates false and no broken cset-tlv is attempted.
If.Xps17SpeakerIirSafety {
	Condition {
		Type Path
		Mode read
		Path "/usr/share/alsa/ucm2/blobs/sof/ipc4/eq_iir/eqiir_subsonic_80hz_safety.bin"
	}
	True.Define.PostMixerSpeakerPlaybackIirBlob "/usr/share/alsa/ucm2/blobs/sof/ipc4/eq_iir/eqiir_subsonic_80hz_safety.bin"
}
