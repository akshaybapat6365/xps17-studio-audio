# Dell XPS 17 9720 (DMI SKU 0AFF) — Enable Intel SOF IPC4 firmware & topology.
#
# Target deployment path (staged only; install atomically with UCM2 DRC fence FIRST!):
#   /etc/modprobe.d/90-sof-ipc4-xps17.conf
#
# Verified against kernel 7.2.15-1-omarchy (`modinfo snd-sof`):
#   filename: /lib/modules/7.2.15-1-omarchy/kernel/sound/soc/sof/snd-sof.ko.zst
#   parm:     ipc_type:Force SOF IPC type. 0 - IPC3, 1 - IPC4 (int)
#
# Required firmware & topology (verified present on disk):
#   /usr/lib/firmware/intel/sof-ipc4/adl/sof-adl.ri (SOF v2.12, Zephyr v4.0)
#   /usr/lib/firmware/intel/sof-ipc4-tplg/sof-adl-rt711-l0-rt1316-l12-rt714-l3.tplg
#
# PREREQUISITE:
#   Install ucm2-drc-fence.conf to:
#     /usr/share/alsa/ucm2/blobs/sof/user_configs/Dell Inc./XPS 17 9720.conf
#   BEFORE rebooting with this file active, so UCM2 never switches on the
#   +13.7 dB makeup-gain IPC4 DRC (`Post Mixer Speaker Playback DRC switch`).
#
# Rollback to stock IPC3:
#   sudo rm -f /etc/modprobe.d/90-sof-ipc4-xps17.conf && reboot

options snd_sof ipc_type=1
